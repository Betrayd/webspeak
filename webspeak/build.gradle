plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'io.freefair.lombok' version '8.14'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()

    maven{
        url = 'https://raw.githubusercontent.com/jitsi/jitsi-maven-repository/master/releases'
    }
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.jetbrains:annotations:24.0.0'

    //Jitsi Libraries
    implementation "org.jitsi:ice4j:3.2-15-g6da2b08"
    implementation "org.jitsi:jitsi-dcsctp:1.0-7-gb548df2"
    implementation "org.jitsi:jitsi-utils:1.0-150-g4ab9a3b"

    //Bouncy castle for handling DTLS
    implementation "org.bouncycastle:bcprov-jdk18on:1.84"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.84"
    implementation "org.bouncycastle:bctls-jdk18on:1.84"

    implementation 'org.eclipse.jetty.websocket:jetty-websocket-jetty-client:12.0.14'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.guava:guava:32.1.2-jre'

    implementation 'org.slf4j:slf4j-api:2.0.17'

}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
